site_name: HB Robotics Knowledge Base
site_description: Canonical robotics and ROS 2 knowledge base with practical articles on navigation, perception, hardware integration, debugging, and deployment.
site_author: HB Robotics
site_url: https://wimblerobotics.github.io/

docs_dir: articles

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html

extra_css:
  - css/feedback.css
  - css/feedback-admin.css

extra_javascript:
  - js/feedback.js
  - js/feedback-admin.js

validation:
  nav:
    omitted_files: ignore

nav:
  - Home: index.md
  - Solve a Problem: notes/index.md
  - Notes:
    - notes/nav2-architecture.md
    - notes/controller-choice.md
    - notes/urdf-frames.md
    - notes/localization-recovery.md
    - notes/gazebo-physics.md
    - notes/workspace-bootstrap.md
    - notes/jazzy-bringup.md
    - notes/outdoor-gps-navigation.md
    - notes/diff-drive-base-control.md
    - notes/close-range-sensing.md
    - notes/custom-bt-plugins.md
    - notes/robot-networking.md
    - notes/robot-health.md
    - notes/control-architecture.md
    - notes/visualization-workflows.md
    - notes/time-sync.md
    - notes/performance-debugging.md
    - notes/calibration-workflows.md
    - notes/docking-semantic-navigation.md
    - notes/map-lifecycle.md
  - Contributing: contributing.md
  - Article Template: article-template.md
  - Tag Glossary: tag-glossary.md
  - Foundations:
      - foundations/ros2-core-communication-and-execution.md
      - foundations/urdf-fundamentals.md
  - Navigation:
      - navigation/nav2-architecture-and-tuning-guide.md
      - navigation/behavior-trees-for-nav2-and-robot-autonomy.md
      - navigation/behavior-tree-plugin-walkthrough.md
      - navigation/docking-and-semantic-navigation-in-nav2.md
      - navigation/localization-state-estimation-and-frame-discipline.md
      - navigation/gps-rtk-and-outdoor-navigation-in-ros2.md
      - navigation/map-lifecycle-versioning-and-field-updates.md
  - Perception:
      - perception/vision-depth-and-lidar-pipelines.md
