site_name: HB Robotics Knowledge Base
site_description: Curated robotics knowledge articles for ROS 2 builders — from strong beginners through senior practitioners.
site_author: HB Robotics

docs_dir: articles

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - tags:
      tags_file: tags.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Foundations:
      - foundations/urdf-as-a-frame-translation-system.md
  - Navigation:
      - navigation/rviz-goals-bt-navigator-and-nav2-flow.md
  - Hardware:
      - hardware/odometry-calibration-for-diff-drive.md
      - hardware/serial-protocols-between-ros2-and-microcontrollers.md
  - Software:
      - software/launch-files-patterns-and-pitfalls.md
  - DevOps:
      - devops/colcon-workspace-discipline.md
  - Tags: tags.md
