  - Hardware:
      - hardware/ros2-hardware-integration-patterns.md
      - hardware/ros2-control-design-patterns-in-jazzy.md
      - hardware/calibration-workflows-for-mobile-robots.md
      - hardware/ultrasonic-sensors-for-robot-safety.md
      - hardware/diff-drive-base-control-with-ros2-control-and-arduino.md
      - hardware/rtk-base-stations-for-outdoor-robots.md
  - Software:
