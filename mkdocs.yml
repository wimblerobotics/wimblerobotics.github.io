site_name: HB Robotics Knowledge Base
site_description: Curated robotics knowledge articles for ROS 2 builders — from strong beginners through senior practitioners.
site_author: HB Robotics
site_url: https://wimblerobotics.github.io/

docs_dir: articles

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html

validation:
  nav:
    omitted_files: ignore

nav:
  - Home: index.md
  - Solve a Problem: notes/index.md
  - Notes:
    - notes/nav2-architecture.md
    - notes/controller-choice.md
    - notes/urdf-frames.md
    - notes/localization-recovery.md
    - notes/gazebo-physics.md
    - notes/workspace-bootstrap.md
    - notes/jazzy-bringup.md
    - notes/outdoor-gps-navigation.md
    - notes/diff-drive-base-control.md
  - Contributing: contributing.md
  - Article Template: article-template.md
  - Tag Glossary: tag-glossary.md
  - Foundations:
      - foundations/ros2-core-communication-and-execution.md
      - foundations/urdf-fundamentals.md
  - Navigation:
      - navigation/nav2-architecture-and-tuning-guide.md
      - navigation/behavior-trees-for-nav2-and-robot-autonomy.md
      - navigation/localization-state-estimation-and-frame-discipline.md
      - navigation/gps-rtk-and-outdoor-navigation-in-ros2.md
  - Perception:
      - perception/vision-depth-and-lidar-pipelines.md
  - Hardware:
      - hardware/ros2-hardware-integration-patterns.md
      - hardware/diff-drive-base-control-with-ros2-control-and-arduino.md
      - hardware/rtk-base-stations-for-outdoor-robots.md
  - Software:
      - software/launch-files-patterns-and-pitfalls.md
      - software/package-xml-cmakelists-and-python-package-structure.md
  - DevOps:
      - devops/simulation-testing-and-deployment-for-ros2.md
      - devops/colcon-workspace-discipline.md
      - devops/jazzy-desktop-and-sbc-setup-for-robots.md
  - Tags: tags.md
